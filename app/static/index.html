<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>autoheal-sre</title>
<style>
  body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #1a1a1a; }
  h1 { font-size: 1.3rem; }
  .row { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  select, button, input[type=text] { font-size: 1rem; padding: 0.4rem 0.7rem; }
  /* native <select> sizes itself to its widest <option> - bug 04's description
     alone is 300+ chars, which without this blows the flex row way past the
     button and shoves it off screen */
  .row select { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row button { flex-shrink: 0; }
  input[type=text] { font-family: inherit; }
  button { cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: 0.5; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .tabs button { background: none; border: 1px solid #ccc; border-radius: 6px; color: #555; }
  .tabs button.active { background: #1a1a1a; color: white; border-color: #1a1a1a; }
  .mode { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1rem; }
  .mode input[type=text] { width: 100%; box-sizing: border-box; }
  .mode textarea { width: 100%; box-sizing: border-box; font-family: monospace; font-size: 0.85rem;
                    padding: 0.5rem; min-height: 140px; resize: vertical; }
  .mode label { font-size: 0.85rem; color: #555; }
  #log { background: #0d1117; color: #c9d1d9; font-family: monospace; font-size: 0.85rem;
         padding: 0.75rem; border-radius: 6px; height: 220px; overflow-y: auto; white-space: pre-wrap; }
  #log .node { color: #79c0ff; }
  #log .err { color: #ff7b72; }
  #result { margin-top: 1rem; }
  #banner { padding: 0.6rem 0.9rem; border-radius: 6px; font-weight: 600; margin-bottom: 0.75rem; }
  #banner.pass { background: #d5f5e3; color: #196f3d; }
  #banner.fail { background: #fadbd8; color: #922b21; }
  pre.diff { background: #f6f8fa; padding: 0.75rem; border-radius: 6px; overflow-x: auto; font-size: 0.85rem; }
  pre.diff .add { color: #196f3d; }
  pre.diff .del { color: #922b21; }
  #approve { background: #196f3d; color: white; border: none; border-radius: 6px; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<h1>autoheal-sre - demo</h1>

<div class="tabs">
  <button id="tab-seeded" class="active">Seeded bug</button>
  <button id="tab-custom">Custom</button>
</div>

<div id="mode-seeded" class="row">
  <select id="bug"></select>
  <button id="run">Run fix</button>
</div>

<div id="mode-custom" class="mode" hidden>
  <div>
    <label for="repo">Repo (owner/name)</label>
    <input type="text" id="repo" placeholder="owner/name">
  </div>
  <div>
    <label for="trace">Trace / error output</label>
    <textarea id="trace" placeholder="paste a pytest failure or traceback here"></textarea>
  </div>
  <button id="run-custom">Fix it</button>
</div>

<div id="log"></div>

<div id="result" hidden>
  <div id="banner"></div>
  <pre class="diff" id="diff"></pre>
  <button id="approve" hidden>Approve &amp; push</button>
  <span id="pr-link"></span>
</div>

<script>
const DEFAULT_REPO = __GITHUB_REPO__;

const tabSeeded = document.getElementById('tab-seeded');
const tabCustom = document.getElementById('tab-custom');
const modeSeeded = document.getElementById('mode-seeded');
const modeCustom = document.getElementById('mode-custom');
const bugSelect = document.getElementById('bug');
const runBtn = document.getElementById('run');
const repoInput = document.getElementById('repo');
const traceInput = document.getElementById('trace');
const runCustomBtn = document.getElementById('run-custom');
const logEl = document.getElementById('log');
const resultEl = document.getElementById('result');
const bannerEl = document.getElementById('banner');
const diffEl = document.getElementById('diff');
const approveBtn = document.getElementById('approve');
const prLinkEl = document.getElementById('pr-link');

let currentRunId = null;

repoInput.value = DEFAULT_REPO;

function showTab(tab) {
  const seeded = tab === 'seeded';
  tabSeeded.classList.toggle('active', seeded);
  tabCustom.classList.toggle('active', !seeded);
  modeSeeded.hidden = !seeded;
  modeCustom.hidden = seeded;
}
tabSeeded.addEventListener('click', () => showTab('seeded'));
tabCustom.addEventListener('click', () => showTab('custom'));

function log(text, cls) {
  const line = document.createElement('div');
  if (cls) line.className = cls;
  line.textContent = text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

function renderDiff(patch) {
  diffEl.innerHTML = '';
  for (const line of patch.split('\n')) {
    const span = document.createElement('div');
    if (line.startsWith('+') && !line.startsWith('+++')) span.className = 'add';
    else if (line.startsWith('-') && !line.startsWith('---')) span.className = 'del';
    span.textContent = line;
    diffEl.appendChild(span);
  }
}

async function loadBugs() {
  const res = await fetch('/bugs');
  const bugs = await res.json();
  bugSelect.innerHTML = bugs.map(b => `<option value="${b.id}">${b.id} - ${b.description}</option>`).join('');
}

function setControlsDisabled(disabled) {
  runBtn.disabled = disabled;
  bugSelect.disabled = disabled;
  runCustomBtn.disabled = disabled;
  repoInput.disabled = disabled;
  traceInput.disabled = disabled;
}

function runFix(query) {
  logEl.innerHTML = '';
  resultEl.hidden = true;
  approveBtn.hidden = true;
  prLinkEl.textContent = '';
  currentRunId = null;
  setControlsDisabled(true);

  const es = new EventSource(`/fix?${query}`);

  es.addEventListener('stage', e => log(JSON.parse(e.data).message));

  es.addEventListener('node', e => {
    const d = JSON.parse(e.data);
    log(`${d.node} (attempt ${d.attempt})${d.passed ? ' - passed' : ''}`, 'node');
  });

  es.addEventListener('result', e => {
    const d = JSON.parse(e.data);
    resultEl.hidden = false;
    if (d.passed) {
      bannerEl.className = 'pass';
      bannerEl.textContent = `Fixed on attempt ${d.attempt}/3`;
      renderDiff(d.patch);
      approveBtn.hidden = false;
      currentRunId = d.run_id;
    } else {
      bannerEl.className = 'fail';
      bannerEl.textContent = `Gave up after ${d.attempt} attempt(s)`;
      diffEl.textContent = d.test_output || '(no output)';
    }
    es.close();
    setControlsDisabled(false);
  });

  es.addEventListener('error', e => {
    // e.data is only set for a real "event: error" the server sent - a dropped
    // or refused connection fires a plain Event with no data, so without this
    // branch a dead server just looks like nothing happened
    log(e.data ? JSON.parse(e.data).message : 'lost connection to the server - is uvicorn still running?', 'err');
    es.close();
    setControlsDisabled(false);
  });
}

function runSeededFix() {
  const bugId = bugSelect.value;
  if (!bugId) return;
  runFix(`bug_id=${encodeURIComponent(bugId)}`);
}

function runCustomFix() {
  const repo = repoInput.value.trim();
  const trace = traceInput.value;
  if (!repo || !trace.trim()) return;
  runFix(`repo=${encodeURIComponent(repo)}&trace=${encodeURIComponent(trace)}`);
}

async function approve() {
  if (!currentRunId) return;
  approveBtn.disabled = true;
  approveBtn.textContent = 'Pushing...';
  try {
    const res = await fetch('/pr', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ run_id: currentRunId }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'PR creation failed');
    prLinkEl.innerHTML = ` <a href="${data.url}" target="_blank">${data.url}</a>`;
    approveBtn.hidden = true;
  } catch (err) {
    prLinkEl.textContent = ` error: ${err.message}`;
    approveBtn.disabled = false;
    approveBtn.textContent = 'Approve & push';
  }
}

runBtn.addEventListener('click', runSeededFix);
runCustomBtn.addEventListener('click', runCustomFix);
approveBtn.addEventListener('click', approve);
loadBugs();
</script>
</body>
</html>
