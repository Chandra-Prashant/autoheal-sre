[project]
name = "autoheal-sre"
version = "0.1.0"
description = "Self-healing code repair agent"
requires-python = ">=3.11"

[project.scripts]
autoheal = "app.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "--ignore=tests/fixtures --ignore=evals/bugs/seeded"
